<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 정보</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-require-auth="true">

  <header id="nav"></header>

  <div class="home-layout">

  <!-- 왼쪽 광고 2개 -->
  <aside class="side-ads side-ads-left" aria-label="왼쪽 광고">
      <span class="side-ad-label">광고</span>

      <img
        src="/assets/ads/ad-sangam.png"
        alt="상암고등학교 광고"
      >

      <img
        src="/assets/ads/ad-toilet.png"
        alt="바로화장실 광고"
      >
    </aside>

  <!-- 기존 내 정보 화면 -->
  <main>
    <h1>내 정보</h1>

    <section class="card">
  <p>
    이메일:
    <strong id="myEmail"></strong>
  </p>

  <p>
    현재 표시 이름:
    <strong id="myDisplayName"></strong>
  </p>

  <div class="nickname-setting">
    <label for="myNickname">
      닉네임 변경
    </label>

    <input
      id="myNickname"
      type="text"
      maxlength="16"
      autocomplete="nickname"
      placeholder="닉네임 입력, 비우면 이메일 이름 사용"
    >

    <p class="nickname-help">
      선택 항목입니다. 한글, 영문, 숫자, 밑줄을 사용해 2~16자로 입력하세요.
      입력칸을 비우고 저장하면 이메일의 @ 앞부분으로 돌아갑니다.
    </p>

    <button
      type="button"
      onclick="saveNickname()"
    >
      닉네임 저장
    </button>

    <p
      id="nicknameMessage"
      class="nickname-message"
      aria-live="polite"
    ></p>
  </div>

  <p class="mypage-post-count">
    내가 쓴 글:
    <strong id="myCount">-</strong>개
  </p>
</section>

    <h2>내가 쓴 글</h2>
    <ul id="myList"></ul>
  </main>

  <!-- 오른쪽 광고 2개 -->
  <aside class="side-ads side-ads-right" aria-label="오른쪽 광고">
      <span class="side-ad-label">광고</span>

      <img
        src="/assets/ads/ad-land.png"
        alt="상암랜드 광고"
      >

      <img
        src="/assets/ads/ad-wonking.png"
        alt="원킹쌤 메이커 프로젝트 광고"
      >
    </aside>

</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/mypage.js"></script>

</body>
</html>
