<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>

<!-- 로그인해야만 볼 수 있는 페이지라는 표시 -->
<body data-require-auth="true">

  <header id="nav"></header>

  <div class="home-layout">

  <!-- 왼쪽 광고 2개 -->
  <aside class="side-ads side-ads-left" aria-label="왼쪽 광고">
      <span class="side-ad-label">광고</span>

      <img
        src="/assets/ads/ad-sangam.png"
        alt="상암고등학교 광고"
      >

      <img
        src="/assets/ads/ad-toilet.png"
        alt="바로화장실 광고"
      >
    </aside>

  <!-- 기존 게시판 -->
  <main>
    <h1>게시판</h1>

    <section class="card">
      <textarea
        id="content"
        placeholder="한 줄 남기기"
      ></textarea>

      <div class="row">
        <button onclick="addPost()">등록</button>
        <button id="aiBtn" onclick="polish()">
          AI에게 다듬어달라기
        </button>
      </div>

      <div id="aiBox"></div>
    </section>

    <section id="noticeSection" class="notice-section" hidden>
<h2 class="notice-section-title">📢 공지사항</h2>
<ul id="noticeList"></ul>
</section>

    <ul id="list"></ul>
  </main>

  <!-- 오른쪽 광고 2개 -->
  <aside class="side-ads side-ads-right" aria-label="오른쪽 광고">
      <span class="side-ad-label">광고</span>

      <img
        src="/assets/ads/ad-land.png"
        alt="상암랜드 광고"
      >

      <img
        src="/assets/ads/ad-wonking.png"
        alt="원킹쌤 메이커 프로젝트 광고"
      >
    </aside>

</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/board.js"></script>

</body>
</html>
