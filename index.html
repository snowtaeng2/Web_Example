<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈</title>
  <!-- 경로는 항상 / 로 시작합니다. 폴더가 깊어져도 안 깨집니다. -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <header id="nav"></header>

  <div class="home-layout">

    <!-- 왼쪽 광고 2개 -->
    <aside class="side-ads side-ads-left" aria-label="왼쪽 광고">
      <span class="side-ad-label">광고</span>
<a
href="https://sangam.sen.hs.kr/"
target="_blank"
rel="noopener noreferrer"
class="side-ad-link"
>
<img
src="/assets/ads/ad-sangam.png"
alt="상암고등학교 광고"
>
</a>

      <a
href="https://page.ajmk.kr/"
target="_blank"
rel="noopener noreferrer"
class="side-ad-link"
>
<img
src="/assets/ads/ad-toilet.png"
alt="바로화장실 광고"
>
</a>
    </aside>

    <!-- 기존 홈 화면 -->
    <main>
      <img src="/assets/logo.svg" alt="로고" class="logo">
      <h1>상암랜드</h1>

      <!-- 로그인 안 했을 때 -->
      <section id="loginBox" class="card" hidden>
  <input
    id="email"
    type="email"
    placeholder="이메일"
  >

  <input
    id="signupNickname"
    type="text"
    maxlength="16"
    autocomplete="nickname"
    placeholder="닉네임 (선택, 2~16자)"
  >

  <input
    id="password"
    type="password"
    placeholder="비밀번호 (6자 이상)"
  >

  <p class="nickname-help">
    회원가입 시 닉네임을 입력하지 않으면 이메일의 @ 앞부분이 이름으로 사용됩니다.
    로그인 시 닉네임을 입력하지 않아도 됩니다.
  </p>

  <div class="row">
    <button type="button" onclick="signUp()">
      회원가입
    </button>

    <button type="button" onclick="signIn()">
      로그인
    </button>
  </div>
  <a href="/pages/guide.html" class="home-guide-banner">
  📖 상암랜드가 처음이라면 이용 가이드 보기
</a>
</section>

      <!-- 로그인 했을 때 -->
      <section id="welcomeBox" class="card" hidden>
  <p id="hello"></p>

  <section class="attendance-box">
    <div class="attendance-info">
      <strong>오늘의 출석 체크</strong>
      <span>매일 한 번, 1,000칩을 받을 수 있습니다.</span>
    </div>

    <button
      type="button"
      id="attendanceBtn"
      onclick="checkAttendance()"
    >
      출석 체크
    </button>

    <p id="attendanceMessage" class="attendance-message"></p>
  </section>

<!-- 상암랜드 이용 가이드 -->
<a href="/pages/guide.html" class="home-guide-banner">
  <span class="home-guide-icon">📖</span>

  <span class="home-guide-content">
    <small>처음 방문하셨나요?</small>
    <strong>상암랜드 이용 가이드</strong>
    <span>
      출석, 게임, 광산, 상점과 게시판 이용 방법을 확인하세요.
    </span>
  </span>

  <span class="home-guide-arrow" aria-hidden="true">
    →
  </span>
</a>

  <!-- 홈 공지사항 -->
<section
id="homeNoticeSection"
class="notice-section home-notice-section"
hidden
>
<h2 class="notice-section-title">📢 공지사항</h2>
<ul id="homeNoticeList"></ul>
</section>

  </section>
  
    </main>

    <!-- 오른쪽 광고 2개 -->
    <aside class="side-ads side-ads-right" aria-label="오른쪽 광고">
      <span class="side-ad-label">광고</span>

      <a
href="https://web-example-dun.vercel.app/"
target="_blank"
rel="noopener noreferrer"
class="side-ad-link"
>
<img
src="/assets/ads/ad-land.png"
alt="상암랜드 광고"
>
</a>

      <a
href="https://www.aimk.kr/"
target="_blank"
rel="noopener noreferrer"
class="side-ad-link"
>
<img
src="/assets/ads/ad-wonking.png"
alt="원킹쌤 메이커 프로젝트 광고"
>
</a>
    </aside>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/home.js"></script>

</body>
</html>
